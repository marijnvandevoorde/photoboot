name: CI

# `check` is required, so both jobs run on every PR. On a docs-only PR
# (only *.md or docs/**) they skip their steps and pass; any other PR runs
# them in full. No paths-ignore: a skipped workflow never reports `check`,
# so the PR could not merge.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Docs-only change?
        id: changes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
          code_files=$(grep -vE '(\.md$|^docs/)' <<<"$files" || true)
          if [ -n "$code_files" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only PR: skipping the checks."
          fi
      - uses: actions/checkout@v7
        if: steps.changes.outputs.code != 'false'
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.code != 'false'
        with:
          node-version: 26
          cache: npm
      - if: steps.changes.outputs.code != 'false'
        run: npm ci
      - if: steps.changes.outputs.code != 'false'
        run: npm run typecheck
      - if: steps.changes.outputs.code != 'false'
        run: npm run lint
      - if: steps.changes.outputs.code != 'false'
        run: npm test
      - if: steps.changes.outputs.code != 'false'
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Docs-only change?
        id: changes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
          code_files=$(grep -vE '(\.md$|^docs/)' <<<"$files" || true)
          if [ -n "$code_files" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.changes.outputs.code != 'false'
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.code != 'false'
        with:
          node-version: 26
          cache: npm
      - if: steps.changes.outputs.code != 'false'
        run: npm ci
      # The runner image ships Google Chrome; the test uses its fake camera.
      - if: steps.changes.outputs.code != 'false'
        run: npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
