# Production: https://boot.small-victories.co behind the host's Traefik.
# Photos live on the host in /storage/photoboot/shares, server events in
# /storage/photoboot/events (both owned by uid 1000, the image's `node` user).
# Secrets come from ~/photoboot/.env: ADMIN_TOKEN (/admin), BREVO_API_KEY
# (event emails), STRIPE_SECRET_KEY + STRIPE_WEBHOOK_SECRET (event payments,
# see README), optional UPLOAD_TOKEN (lock down /api/share). The SQLite
# database lives in /data/events (photoboot.db).
#
#   docker compose up -d --build
#
# Like the server's other apps it has its own edge network `photoboot-edge`
# (10.192.17.0/24), shared only with Traefik (~/traefik lists it too).
# Needs a proxied (orange cloud) DNS record: Traefik only accepts Cloudflare.

services:
  photoboot:
    build: .
    image: photoboot:latest
    container_name: photoboot
    restart: unless-stopped
    environment:
      BASE_URL: https://boot.small-victories.co
      SHARE_DIR: /data/shares
      EVENTS_DIR: /data/events
      SHARE_TTL_DAYS: ${SHARE_TTL_DAYS:-30}
      SHARE_MAX_MB: ${SHARE_MAX_MB:-5000}
      PUBLIC_URL: https://boot.small-victories.co
      PAID_RETENTION_DAYS: ${PAID_RETENTION_DAYS:-365}
      EVENT_PRICE_CENTS: ${EVENT_PRICE_CENTS:-1900}
      EVENT_CURRENCY: ${EVENT_CURRENCY:-eur}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-co.smallvictories.photoboot}
      APPLE_PRODUCT_ID: ${APPLE_PRODUCT_ID:-co.smallvictories.photoboot.eventgallery}
      APPLE_ALLOW_SANDBOX: ${APPLE_ALLOW_SANDBOX:-1}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ADMIN_TOTP_RESET: ${ADMIN_TOTP_RESET:-}
      UPLOAD_TOKEN: ${UPLOAD_TOKEN:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-booth@small-victories.co}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Photoboot}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_AUTOMATIC_TAX: ${STRIPE_AUTOMATIC_TAX:-}
    volumes:
      - /storage/photoboot/shares:/data/shares
      - /storage/photoboot/events:/data/events
    networks:
      - photoboot-edge
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.docker.network=photoboot-edge
      - traefik.http.routers.photoboot.rule=Host(`boot.small-victories.co`)
      - traefik.http.routers.photoboot.entrypoints=websecure
      - traefik.http.routers.photoboot.tls=true
      - traefik.http.routers.photoboot.tls.certresolver=letsencrypt
      - traefik.http.services.photoboot.loadbalancer.server.port=8080

networks:
  photoboot-edge:
    external: true
