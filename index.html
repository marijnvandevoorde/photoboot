<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Photoboot</title>
    <link rel="stylesheet" href="/src/booth.css" />
  </head>
  <body>
    <!-- 1. Setup: pick the printer once. -->
    <section id="setup" class="screen">
      <div class="setup-card">
        <h1>Photoboot</h1>
        <p class="muted">Turn on the printer, then connect to it.</p>
        <button id="connect" class="primary big">Connect printer</button>
        <p id="setup-status" class="muted small" role="status"></p>
        <p id="no-bluetooth" class="warn" hidden>
          This browser can't connect to Bluetooth printers.
          Use Chrome on Android, or the Bluefy browser on iPad.
        </p>
        <button id="skip-printer" class="link">Start without printer</button>
      </div>
    </section>

    <!-- 2. Live camera + capture. -->
    <section id="booth" class="screen" hidden>
      <video id="video" autoplay playsinline muted></video>
      <div id="countdown" class="countdown" hidden></div>
      <div id="flash" class="flash"></div>

      <button id="printer-pill" class="pill" hidden></button>
      <button id="switch-camera" class="icon-btn" hidden aria-label="Switch camera">⟲</button>

      <div class="bar" id="capture-bar">
        <div class="delays" role="radiogroup" aria-label="Timer">
          <button class="delay" data-delay="3" role="radio">3s</button>
          <button class="delay" data-delay="5" role="radio">5s</button>
          <button class="delay" data-delay="10" role="radio">10s</button>
        </div>
        <button id="shutter" class="shutter" aria-label="Take photo"></button>
        <div class="bar-spacer"></div>
      </div>
    </section>

    <!-- 3. Review: retry / print / share. -->
    <section id="review" class="screen" hidden>
      <div class="review-body">
        <img id="photo" alt="Your photo" />
        <figure class="sticker">
          <canvas id="sticker"></canvas>
          <figcaption class="muted small">Sticker preview</figcaption>
        </figure>
      </div>
      <div class="bar">
        <button id="retry" class="secondary big">Retry</button>
        <button id="print" class="primary big">Print</button>
        <button id="share" class="secondary big">Share</button>
      </div>
      <p id="review-status" class="toast" role="status" hidden></p>
    </section>

    <!-- QR overlay -->
    <div id="qr-dialog" class="overlay" hidden>
      <div class="qr-card">
        <div id="qr"></div>
        <p>Scan to get your photo</p>
        <button id="qr-close" class="primary big">Done</button>
      </div>
    </div>

    <script type="module" src="/src/booth.js"></script>
  </body>
</html>
