<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111" />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Photoboot — Print Preview</title>
    <link rel="stylesheet" href="/src/settings.css" />
    <link rel="stylesheet" href="/src/preview.css" />
  </head>
  <body>
    <main>
      <header class="topbar">
        <h1>Print preview</h1>
        <nav>
          <a href="/">Back to booth</a>
          <a href="/settings.html">Settings</a>
        </nav>
      </header>

      <section class="card">
        <h2>Sample photo</h2>
        <div class="row">
          <button id="use-sample" class="primary">Use built-in sample</button>
          <button id="pick-file">Upload a photo</button>
          <input id="file" type="file" accept="image/*" hidden />
        </div>
        <p id="status" class="muted small" role="status">
          Pick a sample. The preview below shows the sticker exactly as it will print, at your current paper width.
        </p>
      </section>

      <section class="card">
        <h2>Live config</h2>
        <ul id="config-summary" class="summary"></ul>
        <p class="muted small">
          Change these in <a href="/settings.html">Settings</a>; this page reloads by itself.
        </p>
      </section>

      <section class="card">
        <h2>Options</h2>
        <label class="checkbox">
          <input id="opt-filter" type="checkbox" />
          Show the filter / twist comparison grid
        </label>
      </section>

      <section class="card preview-card">
        <h2>Rendered sticker</h2>
        <div id="preview-wrap" class="preview-wrap">
          <canvas id="preview" aria-label="Print preview"></canvas>
        </div>
        <p id="preview-meta" class="muted small"></p>
      </section>

      <section class="card preview-card" id="filter-grid-card" hidden>
        <h2>Filter × twist grid</h2>
        <div id="filter-grid" class="filter-grid"></div>
      </section>
    </main>
    <script type="module" src="/src/preview.js"></script>
  </body>
</html>
